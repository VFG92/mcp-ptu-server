# Cloudflare Workers configuration for MCP Server
name = "mcp-server"
main = "src/workers/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
preview_urls = true

# Workers Free plan limits
# - 100,000 requests/day
# - 10ms CPU time per request
# - 128 MB memory
# - 3 MB compressed bundle size

[build]
command = ""

# Durable Objects configuration
[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "MCPSession"
script_name = "mcp-server"

[[durable_objects.bindings]]
name = "SESSION_REGISTRY"
class_name = "SessionRegistry"
script_name = "mcp-server"

# Migrations for Durable Objects (Free plan requires new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MCPSession"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SessionRegistry"]

# Environment variables (optional)
[vars]
# Add any environment variables here if needed
# EXAMPLE_VAR = "value"

# Development configuration
[env.dev]
name = "mcp-server-dev"
vars = { }

# Production configuration  
[env.production]
name = "mcp-server-production"
vars = { }
